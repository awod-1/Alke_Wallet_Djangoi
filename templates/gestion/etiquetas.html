{% extends 'base.html' %}{% block content %}<div class="d-flex justify-content-between align-items-center mb-4"><div><span class="badge text-bg-warning mb-2">Organización</span><h1 class="h2 fw-bold">Mis etiquetas</h1><p class="text-secondary mb-0">Clasifica tus movimientos para encontrarlos fácilmente.</p></div><a class="btn btn-dark" href="{% url 'etiqueta_nueva' %}">+ Nueva etiqueta</a></div><div class="row g-3">{% for etiqueta in etiquetas %}<div class="col-md-6"><div class="card border-0 shadow-sm"><div class="card-body d-flex justify-content-between align-items-center"><strong>{{ etiqueta.nombre }}</strong><div><a class="btn btn-outline-dark btn-sm" href="{% url 'etiqueta_editar' etiqueta.pk %}">Editar</a> <a class="btn btn-outline-danger btn-sm" href="{% url 'etiqueta_eliminar' etiqueta.pk %}">Eliminar</a></div></div></div></div>{% empty %}<div class="col-12"><div class="alert alert-secondary">No tienes etiquetas creadas.</div></div>{% endfor %}</div>{% endblock %}
